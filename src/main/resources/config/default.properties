# Override via .env, env vars or -D flags.

platform=desktop
base.url=https://www.stumbleguys.com
timeout.seconds=20

headless=false
# red dot showing where the automation clicks (desktop)
show.cursor=true
# fixed size keeps layout the same on every machine; maximized is nicer for watching/recording
window.maximized=false
window.width=1440
window.height=900

# empty = start Appium locally
appium.url=
android.device.name=Android Emulator
android.platform.version=
# emulator created by scripts/setup-android.sh; started automatically if not running
android.avd=sg-pixel
# empty = ANDROID_HOME env, else Homebrew / Android Studio default
android.home=
